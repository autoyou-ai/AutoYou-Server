[pytest]
asyncio_mode = auto
addopts = --import-mode=importlib
testpaths =
    tests
    autoyou_agents
# A bare "build" entry here matches directory BASENAMES, so it also matched
# tests/server/build/ and silently dropped that whole suite (13 files, 124
# tests) from every recursive collection - the tests only ran when the path was
# named explicitly. Anchor the build-output trees to their real locations
# instead; patterns containing "/" are matched against the full path.
norecursedirs =
    .*
    __pycache__
    */servers/*/build
    */servers/*/artifacts
    */clients/*/build
    dist
    artifacts
    runtime_modules
    runtime_site_packages
    node_modules
    Pods
python_files =
    test_*.py
    *_test.py
