<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" width="1280" height="590" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">AutoYou architecture</title>
<desc id="d">Your phone, laptop and browser connect to the AutoYou Server on your own computer over an end-to-end encrypted WebRTC link. Telegram, Signal or WhatsApp carry the encrypted Auto-Pair message. The server runs a Google ADK agent harness with AutoYou agents, OpenClaw and Hermes Agent, with Agent Apps, local voice, memory and models through LiteLLM to Ollama or optional cloud providers.</desc>
