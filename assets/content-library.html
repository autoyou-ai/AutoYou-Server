<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Content - AutoYou</title>
  <link rel="stylesheet" href="__CONTENT_API__/assets/content-library.css?v=2">
</head>
<body>
<main id="content-drop-zone">
  <header class="page-header">
    <h1>My Content</h1>
    <div class="actions">
      <button id="settings-toggle" aria-controls="storage" aria-expanded="false">Storage settings</button>
      <details id="add" class="add-content">
        <summary class="button primary">Add content</summary>
        <div class="add-options">
          <label class="button">Choose files<input id="files" type="file" multiple></label>
          <label class="button">Choose a folder<input id="folder" type="file" multiple webkitdirectory></label>
          <p>Or drop files and folders here.</p>
        </div>
      </details>
    </div>
  </header>
  <nav class="agent-links" aria-label="Agent apps">
    <a href="/agent/notes_agent/" target="_top">Notes</a>
    <a href="/agent/page_agent/" target="_top">Pages</a>
    <a href="/agent/media_generation_agent/" target="_top">Media Generation</a>
    <a href="/agent/tasks_agent/" target="_top">Tasks</a>
    <a href="/websites" target="_top">Website Apps</a>
  </nav>
  <section id="storage" aria-labelledby="storage-title" hidden>
    <h2 id="storage-title">Storage settings</h2>
    <p>Existing items stay linked when you change the folder for new content.</p>
    <label for="output-root">Output folder</label>
    <div class="actions storage-field">
      <input id="output-root" placeholder="Absolute folder on this computer">
      <button id="save-root">Use this folder</button>
    </div>
    <p id="protection"></p>
  </section>
  <section class="toolbar" aria-label="Filter content">
    <label>Search<input id="search" type="search" placeholder="Titles, text, or labels" maxlength="300"></label>
    <label>Type<select id="kind">
      <option value="">All types</option><option value="note">Notes</option><option value="page">Pages</option>
      <option value="image">Images</option><option value="video">Video</option><option value="audio">Audio</option>
      <option value="voice">Voice</option><option value="file">Files</option><option value="location">Locations</option>
      <option value="agent">Agents</option>
    </select></label>
    <label>Source<select id="source"><option value="">All sources</option></select></label>
    <label>Collection<select id="collection"><option value="">All collections</option></select></label>
  </section>
  <div class="results-header">
    <div><p id="count">Loading content…</p><p id="sync-status"></p></div>
    <button id="index-existing">Sync from agents</button>
  </div>
  <p id="status" role="status"></p>
  <progress id="progress" aria-label="Upload progress" hidden max="1"></progress>
  <section id="items" class="items" aria-label="Content items"></section>
  <button id="more" hidden>Load more</button>
  <dialog id="editor" aria-labelledby="edit-title">
    <div class="dialog-header">
      <h2 id="edit-title">Organize item</h2>
      <form method="dialog"><button>Close</button></form>
    </div>
    <form id="edit-form">
      <label>Collection<input id="edit-collection" maxlength="100" list="collections"></label>
      <datalist id="collections"></datalist>
      <label>Labels<input id="edit-labels" maxlength="1500" placeholder="Separate labels with commas"></label>
      <button type="button" id="suggest">Use suggested labels</button>
      <label>Annotation<textarea id="edit-note" maxlength="8000" rows="5"></textarea></label>
      <p id="edit-status" role="status"></p>
      <button class="primary" type="submit">Save changes</button>
    </form>
  </dialog>
</main>
<script type="module" src="__CONTENT_API__/assets/content-library.js?v=2"></script>
</body>
</html>
