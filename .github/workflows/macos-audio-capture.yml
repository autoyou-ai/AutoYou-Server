name: macOS audio capture

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/macos-audio-capture.yml
      - servers/macos/native/AutoYouAudioCapture.swift
      - servers/macos/build-backend.sh
  pull_request:
    paths:
      - .github/workflows/macos-audio-capture.yml
      - servers/macos/native/AutoYouAudioCapture.swift
      - servers/macos/build-backend.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-audio-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile ScreenCaptureKit audio helper
        run: >-
          MACOSX_DEPLOYMENT_TARGET=13.0 swiftc -parse-as-library -O
          servers/macos/native/AutoYouAudioCapture.swift
          -framework AVFoundation -framework CoreMedia -framework ScreenCaptureKit
          -o "$RUNNER_TEMP/AutoYouAudioCapture"
