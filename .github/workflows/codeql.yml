name: CodeQL

# CodeQL is the slowest check, so it runs only when Python or JavaScript
# changes, plus a weekly scan that catches newly published queries.
on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - "**.ts"
      - "**.html"
      - ".github/workflows/codeql.yml"
  pull_request:
    paths:
      - "**.py"
      - "**.js"
      - "**.mjs"
      - "**.cjs"
      - "**.ts"
      - "**.html"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "31 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
