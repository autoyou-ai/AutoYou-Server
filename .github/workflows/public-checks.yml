name: Public checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      AUTOYOU_TEST_ROOT: ${{ runner.temp }}/autoyou-test-root
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/test.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/base.txt -r requirements/test.txt
      - name: Check the public export boundary
        run: python scripts/export_public_autoyou_server.py --check
      - name: Check server legal artifacts
        run: >-
          python scripts/check_release_legal_gates.py
          --no-generate
          --strict-unknown-license
          --allow-open-release-blockers
          --report "$RUNNER_TEMP/legal-gate-report.json"
      - name: Run public Python checks
        run: python -m pytest tests/server/build tests/shared/test_native_libsodium.py tests/test_public_source_export.py tests/test_official_build_authorization.py tests/test_release_legal_gates.py -q --no-header -p no:cacheprovider
