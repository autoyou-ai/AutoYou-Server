name: Bug report
description: Report a reproducible problem in the public server source.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a problem. Do not include secrets, access tokens, conversation content, or personal data."
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Use the release version or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux or WSL
        - Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized diagnostics
      description: Remove credentials, personal data, and non-release network details.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, conversation content, and personal data.
          required: true
        - label: This is not a security vulnerability that belongs in the security-reporting channel.
          required: true
