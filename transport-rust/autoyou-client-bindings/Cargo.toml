[package]
name = "autoyou-client-bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
bindgen = ["uniffi/bindgen"]

[[bin]]
name = "autoyou-bindgen"
path = "src/bin/autoyou-bindgen.rs"
required-features = ["bindgen"]

[dependencies]
sha2.workspace = true
autoyou-protocol.workspace = true
autoyou-session.workspace = true
uniffi.workspace = true
thiserror.workspace = true
serde_json.workspace = true
base64.workspace = true
zeroize.workspace = true
sonora.workspace = true
opusic-c.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
# shortcut: netdev needs pre-0.2.190 iOS types; remove when it supports the new mobile bindings.
libc = "=0.2.189"

[dev-dependencies]
uniffi = { workspace = true, features = ["bindgen"] }

[lints]
workspace = true
