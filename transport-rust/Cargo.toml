[workspace]
members = ["autoyou-protocol", "autoyou-session", "autoyou-application-core", "autoyou-client-bindings", "autoyou-python-bindings"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
license-file = "../LICENSE"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
jiter = "=0.16.0"
thiserror = "2"
sha2 = "0.10"
bytes = "1"
base64 = "=0.22.1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "metrics"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
autoyou-protocol = { path = "autoyou-protocol" }
autoyou-session = { path = "autoyou-session" }
autoyou-application-core = { path = "autoyou-application-core" }
iroh-tickets = "=1.0.0"
uniffi = { version = "=0.32.2", default-features = false }
ring = "=0.17.14"
zeroize = "=1.9.0"
aes = { version = "=0.8.4", features = ["zeroize"] }
cbc = "=0.1.2"
subtle = "=2.6.1"
getrandom = "=0.2.17"
tempfile = "=3.27.0"
fernet = { version = "=0.2.2", default-features = false, features = ["rustcrypto", "fernet_danger_timestamps"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
sonora = { version = "=0.2.0", default-features = false }
opusic-c = { version = "=1.6.1", default-features = false, features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
