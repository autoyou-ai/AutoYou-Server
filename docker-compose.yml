services:
  autoyou:
    build:
      context: .
      args:
        AUTOYOU_INCLUDE_COGNEE: ${AUTOYOU_INCLUDE_COGNEE:-0}
        AUTOYOU_INCLUDE_TUNING: ${AUTOYOU_INCLUDE_TUNING:-0}
        AUTOYOU_SKIP_TUNNELMOLE_DOWNLOAD: ${AUTOYOU_SKIP_TUNNELMOLE_DOWNLOAD:-0}
    ports:
      - "127.0.0.1:8001:8001"  # Admin Web Port
      - "127.0.0.1:8067:8067"  # Authenticated Page Service / agent websites
      - "127.0.0.1:8081:8081"  # AI Agent Port (plain HTTP)
      - "127.0.0.1:8481:8481"  # AI Agent Port (HTTPS + one-time code)
    volumes:
      - autoyou-data:/home/autoyou/.local/share/AutoYou
    environment:
      - "AUTOYOU_SERVER_PASSWORD=${AUTOYOU_SERVER_PASSWORD:?Set AUTOYOU_SERVER_PASSWORD before starting AutoYou}"
      - AUTOYOU_NO_DOWNLOAD_TUNNELMOLE=${AUTOYOU_NO_DOWNLOAD_TUNNELMOLE:-0}
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      - SIGNAL_API_URL=http://signal:8080
      # 8067 is published on the host's loopback only, so the Docker gateway
      # peer the page service sees is this computer's own browser.
      - AUTOYOU_PAGE_TRUST_NETWORK_PEERS=1
    depends_on:
      - signal

  signal:
    image: bbernhard/signal-cli-rest-api:latest
    ports:
      - "127.0.0.1:8082:8080" # Expose Signal API on local host port 8082
    volumes:
      - signal-data:/home/.local/share/signal-cli
    restart: unless-stopped

volumes:
  autoyou-data:
  signal-data:
